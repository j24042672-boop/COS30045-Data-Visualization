<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My SVG Garden</title>
</head>
<body>

<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>House and garden illustration</title>
<desc>A brown house with an orange roof under a blue sky, next to a green tree, a sun, a garden path, and three flowers on green grass.</desc>

<!-- Sky -->
<rect x="0" y="0" width="680" height="300" fill="#0B1D3A"/>
<!-- Ground -->
<rect x="0" y="300" width="680" height="140" fill="#1E4D2B"/>

<!-- Sun -->
<circle cx="580" cy="80" r="42" fill="#FFFACD"/>

<!-- Tree -->
<rect x="95" y="215" width="22" height="90" fill="#4E342E"/>
<ellipse cx="106" cy="165" rx="58" ry="50" fill="#FFB7C5"/> 
<ellipse cx="70" cy="190" rx="36" ry="32" fill="#FF91A4"/> 
<ellipse cx="145" cy="185" rx="38" ry="34" fill="#FFC4D9"/>

<line x1="520" y1="410" x2="520" y2="435" stroke="#388E3C" stroke-width="3"/>

<g transform="translate(520,410)">
<ellipse cx="0" cy="-11" rx="6" ry="10" fill="#BA68C8" transform="rotate(0)"/>
<ellipse cx="0" cy="-11" rx="6" ry="10" fill="#BA68C8" transform="rotate(72)"/>
<ellipse cx="0" cy="-11" rx="6" ry="10" fill="#BA68C8" transform="rotate(144)"/>
<ellipse cx="0" cy="-11" rx="6" ry="10" fill="#BA68C8" transform="rotate(216)"/>
<ellipse cx="0" cy="-11" rx="6" ry="10" fill="#BA68C8" transform="rotate(288)"/>
<circle cx="0" cy="0" r="5" fill="#FFEB3B"/>
</g>

<!-- House -->
<polygon points="245,205 355,105 465,205" fill="#C1440E"/>
<rect x="260" y="205" width="190" height="115" fill="#8B5A2B" stroke="#5C3A21" stroke-width="1.5"/>

<g fill="#FFFFBB" stroke="#5C3A21" stroke-width="1.5" transform="translate(0, 10)">
<rect x="285" y="220" width="38" height="38"/>
<rect x="390" y="220" width="38" height="38"/>
</g>

<rect x="335" y="265" width="40" height="55" fill="#5C3A21"/>
<circle cx="367" cy="293" r="3" fill="#2B1A0E"/>

<!-- Garden path -->
<path d="M 340 320 C 320 370 290 400 270 440 L 430 440 C 410 400 380 370 370 320 Z" fill="#D8B989" stroke="#3E2723" stroke-width="4"/>

</svg>
 <img src="Your paragraph text.png" width="680" alt="Annotated SVG">
</body>
</html>
