<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My SVG Garden</title>
</head>
<body>

<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>House and garden illustration</title>
<desc>A brown house with an orange roof under a blue sky, next to a green tree, a sun, a garden path, and three flowers on green grass.</desc>

<!-- Sky -->
<rect x="0" y="0" width="680" height="300" fill="#8ECBEA"/>
<!-- Ground -->
<rect x="0" y="300" width="680" height="140" fill="#4CAF50"/>

<!-- Sun -->
<circle cx="580" cy="80" r="42" fill="#FFD54F"/>

<!-- Tree -->
<rect x="95" y="215" width="22" height="90" fill="#8D6E43"/>
<ellipse cx="106" cy="165" rx="58" ry="50" fill="#3E8E41"/>

<!-- House -->
<polygon points="245,205 355,105 465,205" fill="#C1440E"/>
<rect x="260" y="205" width="190" height="115" fill="#8B5A2B" stroke="#5C3A21" stroke-width="1.5"/>
<rect x="285" y="230" width="38" height="38" fill="#E3F2FD" stroke="#5C3A21" stroke-width="1.5"/>
<rect x="390" y="230" width="38" height="38" fill="#E3F2FD" stroke="#5C3A21" stroke-width="1.5"/>
<rect x="335" y="265" width="40" height="55" fill="#5C3A21"/>
<circle cx="367" cy="293" r="3" fill="#2B1A0E"/>

<!-- Garden path -->
<path d="M 340 320 C 320 370 290 400 270 440 L 430 440 C 410 400 380 370 370 320 Z" fill="#D8B989" stroke="#B08D57" stroke-width="1.5"/>

</g>

</svg>
 <img src="Your paragraph text.png" width="680" alt="Annotated SVG">
</body>
</html>
